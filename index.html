<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text to voice converter</title>
    <link rel="stylesheet" href="assets/bootstrap.min.css">
    <link rel="stylesheet" href="assets/main.css">
</head>
<body>
    <!-- Text to Speech Converter -->
     <div class="voice-main">
        <div class="container text-center">
            <h1>Text to Voice Converter</h1>
            <textarea id="text-input" rows="10" cols="50" placeholder="Enter text here..."></textarea><br>
            <label for="select">Voice:</label>
            <select name="select" id="select" title="Choose a voice" aria-label="Voice selection"></select>
            <button id="convert-btn">Convert to Speech</button>
        </div>
     </div>
    <script src="assets/bootstrap.bundle.min.js"></script>
    <script src="assets/main.js"></script>
</body>
</html>
